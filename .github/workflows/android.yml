name: Build LANA Android

on:
  push:
    branches: [ main, fix/direct-google-navigation ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lana-taxi-assistent-debug
          path: app/build/outputs/apk/debug/app-debug.apk

# Native shell build kept intentionally separate from Vercel web deployment.
